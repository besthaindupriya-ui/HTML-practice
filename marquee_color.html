<!DOCTYPE>
<html>
<head>
<title> Marquee tag </title>
</head>
<body>
<marquee behaviour="slide" bgcolor="red"> ewb cources </marquee>
<marquee behaviour="scroll" bgcolor="blue"> ewb cources </marquee>
<marquee behaviour="alternate" bgcolor="pink"> ewb cources </marquee>
<marquee direction="left" bgcolor="yellow"> ewb cources </marquee>
<marquee direction="right" bgcolor="green"> ewb cources </marquee>
<marquee direction="up" bgcolor="orange"> ewb cources </marquee>
<marquee direction="down" bgcolor="lightblue"> ewb cources </marquee>
<marquee loop="2" bgcolor="maroon"> ewb cources </marquee>
</body>
</html>
