<!DOCTYPE html>
<html>
<head>
<title>Form in html</title>
</head>
<body bgcolor="lightblue">
<form> 
<label><b>UserName: </label><br>
<input type="text" name="uname" size="20"><br><br>
<label><b>PassWord: </label><br>
<input type="pwd" name="pwd" size="20"><br><br>
<label><b>E-mail: </label><br>
<input type="text" name="E-mail" size="20"><br><br> 
<label><b>Phone Number: </label><br>
<input type="text" name="phno" size="20"><br><br>
<label><b> Gender </label><br>
<input type="radio" name="Gender" value="MALE">MALE
<input type="radio" name="Gender" value="FEMALE">FEMALE<br><br>
<label><b>Languages Known: </label><br>
<input type="checkbox" name="English" value="ENGLISH">English
<input type="checkbox" name="Telugu" value="TELUGU">Telugu
<input type="checkbox" name="hindi" value="HINDI">Hindi<br><br>
<label> <b>Course: </label><br>
<select>
<option>C</option>
<option>C++</option>
<option>JAVA</option>
<option>PYTHON</option>
</select><br><br>
<label><b> Address: </label><br>
<textArea cols="10" rows="5"></textArea><br>
<input type="button" value="Submit">
<input type="reset" value="reset">
</form>
</body>
</html>
