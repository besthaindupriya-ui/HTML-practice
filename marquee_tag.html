<!DOCTYPE>
<html>
<head>
<title> Marquee tag </title>
</head>
<body>
<marquee behavior="slide"> ewb cources </marquee>
<marquee behavior="scroll"> ewb cources </marquee>
<marquee behavior="alternate"> ewb cources </marquee>
<marquee direction="left" > ewb cources </marquee>
<marquee direction="right" > ewb cources </marquee>
<marquee direction="up" > ewb cources </marquee>
<marquee direction="down" > ewb cources </marquee>
<marquee loop="2" > ewb cources </marquee>
</body>
</html>
